<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTop DATA | Expert Signals</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <style>
        .page-wrapper { min-height: 100vh; background: var(--bg-primary); padding-top: 80px; }
        .page-container { max-width: 1300px; margin: 0 auto; padding: 0 5% 4rem; }

        .tv-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 5%; height: 72px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .tv-left { display: flex; align-items: center; gap: 2rem; }
        .neon-logo {
            height: 70px; width: auto;
            filter: drop-shadow(0 0 8px #a855f7) drop-shadow(0 0 15px rgba(168,85,247,0.8));
            transition: all 0.3s ease;
        }
        .neon-logo:hover { filter: drop-shadow(0 0 12px #c084fc) drop-shadow(0 0 25px rgba(192,132,252,1)); transform: scale(1.05); }
        .tv-nav { display: flex; gap: 2rem; align-items: center; list-style: none; }
        .tv-nav a { font-size: 0.9rem; font-weight: 600; color: #fff; opacity: 0.8; transition: opacity 0.2s; text-decoration: none; }
        .tv-nav a:hover { opacity: 1; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .tv-right { display: flex; align-items: center; gap: 1rem; }
        .btn-tv-blue { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; border: none; border-radius: 8px; padding: 8px 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .icon-link { color: #94A3B8; font-size: 0.9rem; cursor: pointer; }

        .breadcrumb {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 2rem; font-size: 0.85rem; color: #475569;
        }
        .breadcrumb a { color: #94A3B8; text-decoration: none; transition: color 0.2s; }
        .breadcrumb a:hover { color: #c084fc; }

        .page-title-section { margin-bottom: 2.5rem; }
        .page-title {
            font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 900;
            background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 0.5rem;
        }
        .page-subtitle { color: #94A3B8; font-size: 0.95rem; }

        .guide-box {
            margin-bottom: 2rem; padding: 1.5rem 2rem; border-radius: 14px;
            background: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(99,102,241,0.04));
            border: 1px solid rgba(168,85,247,0.25); border-left: 3px solid #a855f7;
        }
        .guide-box h4 {
            color: #c084fc; font-size: 0.9rem; font-weight: 800; margin-bottom: 0.8rem;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.06em;
        }
        .guide-box p { color: #cbd5e1; font-size: 0.88rem; line-height: 1.8; }
        .guide-note { color: #94A3B8 !important; font-size: 0.84rem !important; line-height: 1.7; font-style: italic; margin-top: 0.8rem; }

        .section-label {
            font-size: 1.1rem; font-weight: 800; color: #c084fc;
            margin-bottom: 1.5rem; padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(168,85,247,0.2);
            display: flex; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .badge-count {
            background: rgba(168,85,247,0.15); color: #c084fc; font-size: 0.7rem;
            padding: 3px 10px; border-radius: 999px; font-weight: 700; margin-left: auto;
        }

        .signal-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 3rem; }

        .signal-card {
            display: grid; grid-template-columns: 140px 1fr auto;
            border-radius: 14px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
            animation: cardFadeIn 0.5s ease forwards; opacity: 0;
        }
        .signal-card:nth-child(1) { animation-delay: 0.05s; }
        .signal-card:nth-child(2) { animation-delay: 0.1s; }
        .signal-card:nth-child(3) { animation-delay: 0.15s; }
        .signal-card:nth-child(4) { animation-delay: 0.2s; }

        @keyframes cardFadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .signal-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }

        .signal-action {
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; font-size: 2rem; font-weight: 900;
            letter-spacing: 0.05em; text-transform: uppercase;
            position: relative;
        }
        .signal-action::after {
            content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
        }

        .signal-card.type-mua { background: linear-gradient(135deg, rgba(16,185,129,0.06), rgba(15,15,25,0.7)); }
        .signal-card.type-mua .signal-action { background: linear-gradient(135deg, #059669, #10B981); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .signal-card.type-mua:hover { border-color: rgba(16,185,129,0.3); box-shadow: 0 12px 40px rgba(16,185,129,0.12); }

        .signal-card.type-ban { background: linear-gradient(135deg, rgba(220,38,38,0.06), rgba(15,15,25,0.7)); }
        .signal-card.type-ban .signal-action { background: linear-gradient(135deg, #991B1B, #B91C1C); color: #FCD34D; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .signal-card.type-ban:hover { border-color: rgba(220,38,38,0.3); box-shadow: 0 12px 40px rgba(220,38,38,0.12); }

        .signal-body { padding: 1.2rem 1.8rem; display: flex; flex-direction: column; justify-content: center; gap: 0.6rem; }
        .signal-title { font-size: 1.15rem; font-weight: 800; color: #f8fafc; letter-spacing: 0.02em; }
        .signal-details { display: flex; flex-direction: column; gap: 4px; }
        .signal-detail-row { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: #cbd5e1; }
        .signal-detail-row .detail-icon { font-size: 0.85rem; width: 18px; text-align: center; flex-shrink: 0; }
        .signal-detail-row strong { color: #f8fafc; font-weight: 700; }
        .detail-label { color: #94A3B8; min-width: 110px; }

        .signal-time {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1.2rem 1.5rem; gap: 4px;
            border-left: 1px solid rgba(255,255,255,0.04); min-width: 140px;
        }
        .time-icon { font-size: 1rem; color: #475569; }
        .time-label { font-size: 0.72rem; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
        .time-value { font-size: 0.9rem; color: #94A3B8; font-weight: 600; text-align: center; line-height: 1.5; }

        .disclaimer-box {
            margin-top: 2rem; padding: 1.2rem 2rem; border-radius: 12px;
            background: rgba(248,113,113,0.06); border: 1px solid rgba(248,113,113,0.2); text-align: center;
        }
        .disclaimer-box h4 {
            color: #f87171; font-size: 0.85rem; font-weight: 800; margin-bottom: 0.5rem;
            text-transform: uppercase; letter-spacing: 0.06em;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .disclaimer-box p { color: #94A3B8; font-size: 0.84rem; line-height: 1.7; }
        .disclaimer-box strong { color: #f87171; }

        .page-footer {
            background: #07070D; border-top: 1px solid rgba(255,255,255,0.08);
            padding: 2rem 5%; text-align: center; color: #475569; font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .signal-card { grid-template-columns: 80px 1fr; }
            .signal-action { font-size: 1.3rem; padding: 1rem; }
            .signal-time { flex-direction: row; gap: 8px; border-left: none; border-top: 1px solid rgba(255,255,255,0.04); grid-column: 1 / -1; padding: 0.8rem 1rem; min-width: unset; }
            .signal-body { padding: 1rem; }
            .tv-nav { display: none; }
        }
    </style>
</head>
<body>

        // Signal data
        var VIP = [
            {type:'ban',title:'B\u00C1N 100% ANV 24',d:[

            {type:'ban',title:'B\u00C1N HHV 18',d:[

                ['\uD83D\uDCCA','L\u00E3i / L\u1ED7 (%):','+8% (TEST M\u00D4 PH\u1ECENG)','#34d399']
            ],t:'21:53:36',dt:'04-05-2026'},
            {type:'mua',title:'MUA GVR 34.55',d:[

                ['\uD83D\uDCCD','M\u1EE5c ti\u00EAu:','38 - 42',''],
                ['\uD83D\uDEE1\uFE0F','D\u1EEBng l\u1ED7:','32.7 (TEST M\u00D4 PH\u1ECENG WEB)','#f87171']
            ],t:'21:52:59',dt:'04-05-2026'},
            {type:'mua',title:'MUA CEO 17.9',d:[

                ['\uD83D\uDCCD','M\u1EE5c ti\u00EAu:','20 - 22 - 24',''],
                ['\uD83D\uDEE1\uFE0F','D\u1EEBng l\u1ED7:','17.2 (TEST M\u00D4 PH\u1ECENG WEB)','#f87171']
