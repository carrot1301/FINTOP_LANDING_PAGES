<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Trade | FinTop DATA</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #07070D;
            color: #cbd5e1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .tv-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 5%; height: 72px;
            background: rgba(10,10,15,0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .tv-left { display: flex; align-items: center; gap: 2rem; }
        .neon-logo {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #c084fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(192,132,252,0.6));
        }
        .tv-nav { display: flex; gap: 2rem; align-items: center; list-style: none; }
        .tv-nav a { font-size: 0.9rem; font-weight: 600; color: #fff; opacity: 0.8; transition: opacity 0.2s; text-decoration: none; }
        .tv-nav a:hover { opacity: 1; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        
        .main-container {
            flex: 1;
            padding-top: 100px;
            padding-bottom: 4rem;
            padding-left: 5%;
            padding-right: 5%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Expert Cards Grid */
        .expert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 3rem;
        }
        .expert-card {
            background: rgba(15, 15, 25, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s;
        }
        .expert-card:hover {
            transform: translateY(-5px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 12px 40px rgba(168, 85, 247, 0.15);
        }
        .expert-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.25rem;
        }
        .expert-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-size: 1.25rem;
            box-shadow: 0 0 15px rgba(168,85,247,0.4);
            flex-shrink: 0;
        }
        .expert-info h3 {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .expert-strategy {
            color: #c084fc;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .expert-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 0;
        }
        .stat-box {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: #e2e8f0;
        }
        .stat-value.profit-plus {
            color: #34d399;
        }
        .stat-value.profit-minus {
            color: #f87171;
        }
        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-copy:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        /* Order Table */
        .order-table-wrapper {
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 12px;
            overflow-x: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
            color: #cbd5e1;
        }
        .order-table th {
            padding: 14px 16px;
            color: #c084fc;
            font-weight: 700;
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            background: rgba(168, 85, 247, 0.08);
        }
        .order-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            display: inline-block;
            text-align: center;
        }
        .badge-buy {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge-sell {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .page-footer {
            background: #07070D;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 2rem 5%;
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            margin-top: 3rem;
        }
        @media (max-width: 768px) {
            .tv-nav { display: none; }
        }
    </style>
</head>
<body>
    <header class="tv-header">
        <div class="tv-left">
            <a href="../../index.html" class="neon-logo">FinTop DATA</a>
        </div>
        <ul class="tv-nav" id="navMenu">
            <li><a href="../../index.html">Trang chủ</a></li>
            <li><a href="../../index.html#panel-hoivien">Hội viên</a></li>
            <li><a href="../index.html">Tra cứu CP</a></li>
            <li><a href="../bo-loc/index.html">Bộ lọc CP</a></li>
            <li><a href="../tin-hieu/index.html">Tín hiệu CG</a></li>
            <li><a href="index.html" style="color: #c084fc;">Copy Trade</a></li>
            <li><a href="../../fintop-ai/index.html">FinTop AI</a></li>
            <li><a href="../../index.html#panel-guide-trading">Hướng dẫn</a></li>
        </ul>
        <div class="tv-right">
            <span style="color:#94A3B8;font-size:0.9rem;cursor:pointer;">VI</span>
            <div class="user-dropdown-container" id="userDropdownContainer">
                <span class="icon-link" style="cursor: pointer; color: #fff;">👤</span>
                <div class="user-dropdown-menu">
                    <a href="../../index.html#login" class="user-dropdown-item login-btn">👤 Đăng nhập</a>
                    <a href="../../index.html#panel-guide-trading" class="user-dropdown-item">Trung tâm Trợ giúp</a>
                    <a href="../../index.html" class="user-dropdown-item">Có gì mới</a>
                </div>
            </div>
            <button class="btn-tv-blue" id="fintopStartBtn" type="button" onclick="location.href='../../index.html#panel-hoivien'">Bắt đầu</button>
        </div>
    </header>

    <main class="main-container" aria-label="Copy Trade"></main>

    <footer class="page-footer">
        <p>&copy; 2026 FinTop DATA. Bảo lưu mọi quyền.</p>
    </footer>

    <!-- Core Infrastructure Bootstrap -->
    <script src="../../assets/js/auth.js" defer></script>
    <script type="module" src="../../assets/js/core/index.js"></script>
    <script>
        (function() {
            let masters = [];
            let orders = [];

            const expertGrid = document.getElementById('expertGrid');
            const orderLogsBody = document.getElementById('orderLogsBody');
            const orderCount = document.getElementById('orderCount');

            async function loadBackendData() {
                if (window.FintopInfra) {
                    try {
                        const [mRes, oRes] = await Promise.all([
                            window.FintopInfra.ApiClient.get('/copy-trade/masters'),
                            window.FintopInfra.ApiClient.get('/copy-trade/orders')
                        ]);
                        
                        const mList = mRes.data || mRes || [];
                        const oList = oRes.data || oRes || [];
                        
                        if (Array.isArray(mList)) {
                            masters = mList.map(m => ({
                                id: m.id,
                                name: m.name,
                                strategy: m.strategy,
                                aum: Number(m.aum),
                                followers: m.followers || 0,
                                profit: Number(m.profit || 0),
                                winRate: Number(m.winRate || 0),
                                status: m.status
                            }));
                        } else {
                            masters = [];
                        }
                        
                        if (Array.isArray(oList)) {
                            orders = oList.map(o => ({
                                id: o.id,
                                time: o.time,
                                symbol: o.symbol,
                                action: o.action,
                                price: Number(o.price),
                                quantity: Number(o.quantity),
                                accounts: o.accounts,
                                status: o.status,
                                masterName: o.master?.name || '',
                                successRate: Number(o.successRate || 100)
                            }));
                        } else {
                            orders = [];
                        }

                        renderAll();
                        return;
                    } catch (err) {
                        console.error('Backend Copy Trade fetch failed:', err);
                    }
                }

                masters = [];
                orders = [];
                renderAll();
            }

            function getInitials(name) {
                if (!name) return 'CG';
                const parts = name.trim().split(/\s+/);
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
                }
                return name.substring(0, 2).toUpperCase();
            }

            function renderAll() {
                // 1. Render Masters
                const activeMasters = masters.filter(m => m.status === 'ACTIVE');
                if (activeMasters.length === 0) {
                    expertGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: #64748b;">Chưa có chuyên gia hoạt động.</div>`;
                } else {
                    expertGrid.innerHTML = activeMasters.map(m => {
                        const initials = getInitials(m.name);
                        const formatAum = m.aum >= 1000000000 ? (m.aum / 1000000000).toFixed(1) + ' tỷ' : (m.aum / 1000000).toFixed(0) + ' triệu';
                        return `
                            <div class="expert-card">
                                <div>
                                    <div class="expert-header">
                                        <div class="expert-avatar">${initials}</div>
                                        <div class="expert-info">
                                            <h3>${m.name}</h3>
                                            <div class="expert-strategy">${m.strategy}</div>
                                        </div>
                                    </div>
                                    <div class="expert-stats">
                                        <div class="stat-box">
                                            <span class="stat-label">Hiệu quả tháng</span>
                                            <span class="stat-value profit-plus">+${m.profit}%</span>
                                        </div>
                                        <div class="stat-box">
                                            <span class="stat-label">Tỷ lệ thắng</span>
                                            <span class="stat-value" style="color: #fbbf24;">${m.winRate}%</span>
                                        </div>
                                        <div class="stat-box" style="margin-top: 8px;">
                                            <span class="stat-label">Vốn sao chép (AUM)</span>
                                            <span class="stat-value">${formatAum}</span>
                                        </div>
                                        <div class="stat-box" style="margin-top: 8px;">
                                            <span class="stat-label">Người sao chép</span>
                                            <span class="stat-value" style="color: #38bdf8;">${m.followers} TK</span>
                                        </div>
                                    </div>
                                </div>
                                <button class="btn-copy" onclick="handleCopyClick('${m.name}')">Sao Chép Lệnh</button>
                            </div>
                        `;
                    }).join('');
                }

                // 2. Render Orders
                orderCount.textContent = `${orders.length} lệnh`;
                if (orders.length === 0) {
                    orderLogsBody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 2rem; color: #64748b;">Chưa có nhật ký lệnh copy nào.</td></tr>`;
                } else {
                    orderLogsBody.innerHTML = orders.map((o, idx) => {
                        const timeStr = new Date(o.time).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + new Date(o.time).toLocaleDateString('vi-VN');
                        const isBuy = o.action === 'MUA';
                        const actionBadge = isBuy ? '<span class="action-badge badge-buy">MUA</span>' : '<span class="action-badge badge-sell">BÁN</span>';
                        
                        const masterName = o.masterName || (activeMasters[idx % activeMasters.length] || activeMasters[0] || { name: 'Chuyên gia FinTop' }).name;

                        return `
                            <tr>
                                <td style="color: #64748b; font-size: 0.8rem;">${timeStr}</td>
                                <td style="font-weight: 600; color: #fff;">${masterName}</td>
                                <td style="font-weight: 700; color: #c084fc;">${o.symbol}</td>
                                <td>${actionBadge}</td>
                                <td style="font-weight: 600;">${o.price.toLocaleString('vi-VN')} đ</td>
                                <td>${o.quantity.toLocaleString('vi-VN')}</td>
                                <td style="color: #38bdf8; font-weight: 600;">${o.accounts} tài khoản</td>
                                <td><span class="action-badge badge-buy" style="background: rgba(16,185,129,0.12); color:#10B981; border: 1px solid rgba(16,185,129,0.25);">SUCCESS</span></td>
                            </tr>
                        `;
                    }).join('');
                }
            }

            window.handleCopyClick = function(masterName) {
                // If window.FintopInfra is ready, verify auth & tier
                if (window.FintopInfra) {
                    const Infra = window.FintopInfra;
                    if (!Infra.AuthManager.isAuthenticated) {
                        if (typeof window.requestAuthChoice === 'function') {
                            window.requestAuthChoice('login');
                        } else if (typeof window.openAuthModal === 'function') {
                            window.openAuthModal();
                        } else {
                            location.href = '../../index.html#login';
                        }
                        return;
                    }
                    const user = Infra.AppState.get('auth', 'user');
                    const tier = user?.tierLevel || 'STANDARD';
                    if (tier !== 'DIAMOND') {
                        alert(`Tính năng Sao Chép Lệnh yêu cầu gói Hội viên DIAMOND. Hiện tại tài khoản của bạn đang là gói ${tier}. Vui lòng nâng cấp để sử dụng!`);
                        location.href = '../../index.html#panel-hoivien';
                        return;
                    }
                }
                alert(`Đăng ký sao chép lệnh của Chuyên gia ${masterName} thành công! Hệ thống VPS/TCBS của bạn đã được kết nối tự động.`);
            }

            // Khu vực Copy Trade được để trống cho đến khi có nội dung chính thức.
        })();
    </script>
</body>
</html>
