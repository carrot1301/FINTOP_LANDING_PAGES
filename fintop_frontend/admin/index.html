<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Console — FINTop DATA</title>
  <meta name="description" content="FINTop DATA Production Admin Console — Quản trị hệ thống">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Design Tokens + Base -->
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
  <link rel="stylesheet" href="../../assets/css/modals.css">
  <link rel="stylesheet" href="./admin.css">

  <style>
    /* Inline critical styles for initial load */
    body { margin: 0; background: #0A0A0F; color: #F8FAFC; font-family: 'Be Vietnam Pro', sans-serif; }
    .admin-boot-loading {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      flex-direction: column; gap: 1rem;
    }
    .admin-boot-loading .boot-spinner {
      width: 36px; height: 36px; border: 3px solid rgba(124,58,237,0.2);
      border-top-color: #7C3AED; border-radius: 50%; animation: admin-spin 0.7s linear infinite;
    }
    .admin-boot-loading .boot-text { color: #94A3B8; font-size: 0.85rem; }
  </style>
</head>
<body>
  <!-- Boot loading screen (replaced after auth check) -->
  <div id="admin-boot" class="admin-boot-loading">
    <div class="boot-spinner"></div>
    <div class="boot-text">Đang tải Admin Console...</div>
  </div>

  <!-- Admin shell (hidden until auth verified) -->
  <div id="admin-app" class="admin-shell" style="display:none;">
    <!-- Sidebar -->
    <aside id="admin-sidebar" class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="../../index.html" class="admin-logo-link" title="Quay lại trang người dùng">
          <img src="../../assets/images/fintop-logo.png" alt="FinTop DATA" class="neon-logo">
        </a>
        <div>
          <div class="admin-sidebar-title">Admin Console</div>
          <div class="admin-sidebar-subtitle">FINTop DATA</div>
        </div>
      </div>

      <nav id="admin-nav" class="admin-nav">
        <!-- Populated by admin-shell.js -->
      </nav>

      <div class="admin-sidebar-footer">
        <div id="admin-user-badge" class="admin-user-badge">
          <!-- Populated by admin-shell.js -->
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div id="admin-topbar-title" class="admin-topbar-title">Tổng quan</div>
        <div class="admin-topbar-actions">
          <button id="admin-logout-btn" class="admin-btn admin-btn-secondary admin-btn-sm" title="Đăng xuất">
            🚪 Đăng xuất
          </button>
        </div>
      </header>

      <div id="admin-content" class="admin-content">
        <!-- Module content rendered here by admin-shell.js -->
      </div>
    </main>
  </div>

  <!-- Access denied page -->
  <div id="admin-denied" class="admin-access-denied" style="display:none;">
    <div>
      <div class="denied-icon">🔒</div>
      <div class="denied-title">Truy cập bị từ chối</div>
      <div class="denied-desc">
        Bạn không có quyền truy cập trang quản trị.
        Vui lòng đăng nhập bằng tài khoản quản trị viên.
      </div>
      <button id="admin-denied-login" class="admin-btn admin-btn-primary">Đăng nhập</button>
      <a href="/" class="admin-btn admin-btn-secondary" style="margin-left:0.5rem;">Về trang chủ</a>
    </div>
  </div>

  <!-- Core infrastructure (must load first) -->
  <script type="module" src="../../assets/js/core/index.js"></script>

  <!-- Admin shell controller -->
  <script type="module" src="./admin-shell.js"></script>
</body>
</html>
