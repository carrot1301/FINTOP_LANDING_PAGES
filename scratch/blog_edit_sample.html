                                <textarea class="form-control" type="text" name="decision" id="decision" placeholder="Nhập nội dung...">&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;VIB l&amp;agrave; đại diện ti&amp;ecirc;u biểu cho m&amp;ocirc; h&amp;igrave;nh ng&amp;acirc;n h&amp;agrave;ng b&amp;aacute;n lẻ hiện đại với tỷ lệ ROE (lợi nhuận tr&amp;ecirc;n vốn chủ sở hữu) lu&amp;ocirc;n thuộc nh&amp;oacute;m dẫn đầu hệ thống (trung b&amp;igrave;nh ~25% từ 2020 đến nay).&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p style=&quot;text-align:center&quot;&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;a href=&quot;https://docs.google.com/document/d/1vUe4PHqto01YZxWT8-mOZOX_Z862zjvluP51TFj7PWk/edit?tab=t.0#heading=h.om8w6w6jap4p&quot;&gt;&lt;span style=&quot;color:#9900ff&quot;&gt;&lt;strong&gt;&lt;span style=&quot;font-size:24px&quot;&gt;PH&amp;Acirc;N T&amp;Iacute;CH CHI TIẾT VIB 2026 | &amp;quot;Ng&amp;ocirc;i sao B&amp;aacute;n lẻ&amp;quot; của ng&amp;agrave;nh Ng&amp;acirc;n h&amp;agrave;ng&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-size:24px&quot;&gt;&lt;strong&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;Phần 1: Tổng quan doanh nghiệp&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;L&amp;agrave; một ng&amp;acirc;n h&amp;agrave;ng tầm trung c&amp;oacute; đặc th&amp;ugrave; tập trung mạnh mẽ v&amp;agrave;o mảng b&amp;aacute;n lẻ, VIB sở hữu c&amp;aacute;c lợi thế:&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Nền tảng quản trị rủi ro vững chắc:&lt;/strong&gt; nh&amp;agrave; băng c&amp;oacute; chất lượng t&amp;agrave;i sản l&amp;agrave;nh mạnh với danh mục cho vay c&amp;oacute; hơn &lt;strong&gt;90%&lt;/strong&gt; t&amp;agrave;i sản đảm bảo l&amp;agrave; bất động sản.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Tập trung v&amp;agrave;o Chuyển đổi số v&amp;agrave; Tối ưu h&amp;oacute;a vận h&amp;agrave;nh: &lt;/strong&gt;Trải nghiệm người d&amp;ugrave;ng t&amp;iacute;ch cực tr&amp;ecirc;n ứng dụng MyVIB đ&amp;oacute;ng g&amp;oacute;p cho tỷ lệ giao dịch số của VIB ở mức cao-tr&amp;ecirc;n 95%. Đầu tư v&amp;agrave;o c&amp;ocirc;ng nghệ gi&amp;uacute;p giảm chỉ số CIR (chi ph&amp;iacute; tr&amp;ecirc;n thu nhập) v&amp;agrave; tạo ra lợi thế cạnh tranh d&amp;agrave;i hạn trong kỷ nguy&amp;ecirc;n t&amp;agrave;i ch&amp;iacute;nh số.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Tiếng tăm tr&amp;ecirc;n thị trường b&amp;aacute;n lẻ:&lt;/strong&gt; VIB dẫn đầu thị phần trong hai mảng then chốt l&amp;agrave; Cho vay mua &amp;ocirc; t&amp;ocirc; v&amp;agrave; Thẻ t&amp;iacute;n dụng.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;strong&gt;&lt;span style=&quot;font-size:24px&quot;&gt;Phần 2: Hiệu quả 2025 v&amp;agrave; Động lực 2026&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;color:#000000&quot;&gt;&lt;em&gt;&lt;strong&gt;&lt;span style=&quot;font-size:18px&quot;&gt;1&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;/span&gt;&lt;em&gt;&lt;strong&gt;&lt;span style=&quot;font-size:18px&quot;&gt;. Điểm s&amp;aacute;ng kinh doanh năm 2025&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;Trong bối cảnh thị trường c&amp;oacute; nhiều biến động, VIB vẫn duy tr&amp;igrave; &lt;strong&gt;tỷ trọng cho vay b&amp;aacute;n lẻ khoảng 70%&lt;/strong&gt; tổng dư nợ.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Hiệu quả sinh lời:&lt;/strong&gt; Bi&amp;ecirc;n l&amp;atilde;i thuần (NIM) năm 2025 đạt &lt;strong&gt;3.1%&lt;/strong&gt;.&amp;nbsp;Thu nhập ngo&amp;agrave;i l&amp;atilde;i tăng nhẹ &lt;strong&gt;2.5%&lt;/strong&gt;.&amp;nbsp;Nh&amp;agrave; băng vượt cột mốc ph&amp;aacute;t h&amp;agrave;nh hơn 1 triệu thẻ t&amp;iacute;n dụng, doanh số chi ti&amp;ecirc;u thẻ tăng &lt;strong&gt;10%&lt;/strong&gt; svck, củng cố vị thế dẫn đầu thị trường thẻ t&amp;iacute;n dụng.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Chất lượng t&amp;agrave;i sản:&lt;/strong&gt; Tỷ lệ nợ xấu (NPL) được kiểm so&amp;aacute;t ở mức &lt;strong&gt;2.97%&lt;/strong&gt;. D&amp;ugrave; c&amp;oacute; &amp;aacute;p lực tăng nhẹ, nhưng với &lt;strong&gt;92% t&amp;agrave;i sản đảm bảo l&amp;agrave; bất động sản&lt;/strong&gt;, ng&amp;acirc;n h&amp;agrave;ng sở hữu &amp;quot;tấm đệm&amp;quot; an to&amp;agrave;n cực kỳ vững chắc.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Vận h&amp;agrave;nh tinh gọn:&lt;/strong&gt; Chỉ số chi ph&amp;iacute; tr&amp;ecirc;n thu nhập (CIR) ở mức&amp;nbsp;&lt;strong&gt;37.2%. &lt;/strong&gt;Với&amp;nbsp;hiệu quả từ việc chuyển dịch giao dịch l&amp;ecirc;n k&amp;ecirc;nh số MyVIB (chiếm hơn 95% giao dịch), con số n&amp;agrave;y chắc chắn sẽ được cải thiện trong năm 2026.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;color:#000000&quot;&gt;&lt;em&gt;&lt;strong&gt;&lt;span style=&quot;font-size:18px&quot;&gt;2&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;/span&gt;&lt;em&gt;&lt;strong&gt;&lt;span style=&quot;font-size:18px&quot;&gt;. Cơ sở bứt ph&amp;aacute; cho năm 2026&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;Bước sang năm 2026, VIB hội tụ ba yếu tố then chốt để th&amp;uacute;c đẩy lợi nhuận:&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Thứ nhất, chu kỳ phục hồi của bất động sản:&lt;/strong&gt; Với danh mục t&amp;agrave;i sản đảm bảo tập trung tối đa v&amp;agrave;o địa ốc, sự ấm l&amp;ecirc;n của thị trường trong năm 2026 sẽ gi&amp;uacute;p VIB đẩy nhanh tốc độ xử l&amp;yacute; nợ v&amp;agrave; ho&amp;agrave;n nhập dự ph&amp;ograve;ng, ước t&amp;iacute;nh đ&amp;oacute;ng g&amp;oacute;p từ &lt;strong&gt;1,500 - 2,000 tỷ đồng&lt;/strong&gt; v&amp;agrave;o lợi nhuận.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Thứ hai, tối ưu h&amp;oacute;a chi ph&amp;iacute; vốn (CoF):&lt;/strong&gt; Lộ tr&amp;igrave;nh n&amp;acirc;ng hạng thị trường chứng kho&amp;aacute;n 2026 sẽ mở ra cơ hội cho VIB tiếp cận c&amp;aacute;c nguồn vốn quốc tế với chi ph&amp;iacute; rẻ hơn, gi&amp;uacute;p nới rộng bi&amp;ecirc;n lợi nhuận trong bối cạnh cạnh tranh l&amp;atilde;i suất huy động nội địa.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Thứ ba, động lực từ hệ sinh th&amp;aacute;i số:&lt;/strong&gt; Việc c&amp;aacute; nh&amp;acirc;n h&amp;oacute;a tối đa trải nghiệm người d&amp;ugrave;ng qua AI v&amp;agrave; Big Data kh&amp;ocirc;ng chỉ gi&amp;uacute;p giữ ch&amp;acirc;n kh&amp;aacute;ch h&amp;agrave;ng m&amp;agrave; c&amp;ograve;n giảm chi ph&amp;iacute; huy động vốn d&amp;agrave;i hạn, duy tr&amp;igrave; tăng trưởng thu nhập ngo&amp;agrave;i l&amp;atilde;i.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;strong&gt;&lt;span style=&quot;font-size:24px&quot;&gt;Phần 3: Dự ph&amp;oacute;ng 2026&lt;/span&gt;&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;em&gt;&lt;strong&gt;&lt;span style=&quot;font-size:18px&quot;&gt;1. Định hướng v&amp;agrave; Mục ti&amp;ecirc;u kinh doanh&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;Năm 2026, VIB đặt ra những mục ti&amp;ecirc;u như sau:&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Tăng trưởng t&amp;iacute;n dụng: 15%.&lt;/strong&gt; Ng&amp;acirc;n h&amp;agrave;ng tiếp tục ph&amp;aacute;t huy thế mạnh ở c&amp;aacute;c sản phẩm cốt l&amp;otilde;i: mua nh&amp;agrave;, &amp;ocirc; t&amp;ocirc; v&amp;agrave; t&amp;iacute;n dụng, cũng như tập trung v&amp;agrave;o tệp kh&amp;aacute;ch h&amp;agrave;ng c&amp;aacute; nh&amp;acirc;n.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Quản trị rủi ro:&lt;/strong&gt; VIB mong muốn mức nợ xấu năm 2026 đạt dưới &lt;strong&gt;2%&lt;/strong&gt; nhờ siết chặt ti&amp;ecirc;u chuẩn cho vay, c&amp;ugrave;ng với sự phục hồi của thị trường bất động sản.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;&lt;strong&gt;Lợi nhuận trước thuế: 20-25%.&amp;nbsp;&lt;/strong&gt;&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;h2&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;em&gt;&lt;strong&gt;&lt;span style=&quot;font-size:18px&quot;&gt;2. Cổ tức&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;/span&gt;&lt;/h2&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;Kế hoạch chia cổ tức của VIB trong năm 2026 được Đại hội đồng cổ đ&amp;ocirc;ng th&amp;ocirc;ng qua l&amp;agrave; 18.5%, trong đ&amp;oacute; 9% l&amp;agrave; tiền mặt, 9.5% l&amp;agrave; cổ phiếu thưởng.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;h2&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;em&gt;&lt;strong&gt;&lt;span style=&quot;font-size:18px&quot;&gt;3. Kế hoạch tăng vốn&lt;/span&gt;&lt;/strong&gt;&lt;/em&gt;&lt;/span&gt;&lt;/h2&gt;

&lt;p&gt;&lt;span style=&quot;font-family:Arial,Helvetica,sans-serif&quot;&gt;&lt;span style=&quot;font-size:16px&quot;&gt;Ng&amp;acirc;n h&amp;agrave;ng dự kiến thực hiện lộ tr&amp;igrave;nh tăng vốn điều lệ từ mức 34.040 tỷ đồng l&amp;ecirc;n 37.353 tỷ đồng, tương ứng với tỷ lệ tăng trưởng tối đa l&amp;agrave; 9,74%.&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;

&lt;p style=&quot;text-align:center&quot;&gt;&amp;nbsp;&lt;/p&gt;
